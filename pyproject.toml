[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Lokaler Sprachassistent für Ubuntu (Claude Fable 5, YOLO, Whisper, Piper)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "anthropic>=0.116.0",
]

[project.optional-dependencies]
# Vollausstattung (GUI, Sprache, Vision). Kernbetrieb geht auch ohne.
full = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "psutil>=5.9",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "openwakeword>=0.6",
    "ultralytics>=8.3",
    "opencv-python>=4.9",
]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.tools", "jarvis.gui"]

[tool.pytest.ini_options]
testpaths = ["jarvis/tests"]
