; WISP — Wireless Insight & Signal Platform
; Firmware for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262 + SSD1306 OLED)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = heltec_wifi_lora_32_V3
src_dir = src

[env:heltec_wifi_lora_32_V3]
platform = espressif32@^6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Faster PSRAM/flash and USB CDC on boot so Serial works over the native USB port.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D WISP_VERSION=\"0.1.0\"

lib_deps =
    olikraus/U8g2@^2.35.19
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.2

; WiFi + BLE + LoRa together make a large binary; use the big single-app table.
board_build.partitions = huge_app.csv
