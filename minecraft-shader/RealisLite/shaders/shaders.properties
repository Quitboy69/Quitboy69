# ============================================================
#  RealisLite - realistischer Leichtgewicht-Shader
#  Zielhardware: Intel UHD 620 (HP EliteBook 850 G5, i5-8250U/8350U)
#  Kompatibel mit Iris (empfohlen) und OptiFine
# ============================================================

# Bloom-Pass nur ausfuehren, wenn die Option aktiv ist (spart einen Vollbild-Pass)
program.composite.enabled=BLOOM

# Schatten
shadow.culling=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=ENTITY_SHADOWS
shadowBlockEntities=true
shadowPlayer=true

# Vanilla-Effekte, die wir selbst ersetzen
clouds=fast
sun=true
moon=true
sky=true
stars=false
vignette=false
underwaterOverlay=false
oldLighting=false
oldHandLight=false
separateAo=false
frustum.culling=true

# Aufloesungs-Vorgaben fuer Iris (colortex1 nur fuer Bloom)
# (kein Schatten-Farbpuffer-Mipmap noetig)

# ---------- Voreinstellungen ----------
profile.NIEDRIG=shadowMapResolution=512 shadowDistance=64.0 SHADOW_SAMPLES=1 SHADOW_SOFTNESS=0.75 !COLORED_SHADOWS !ENTITY_SHADOWS !SPECULAR !RAIN_WETNESS !FOG_HEIGHT !WATER_REFLECTION !BLOOM !GRAIN WAVING_LEAVES WAVING_PLANTS STARS
profile.MITTEL=shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SAMPLES=2 SHADOW_SOFTNESS=1.0 !COLORED_SHADOWS ENTITY_SHADOWS SPECULAR RAIN_WETNESS FOG_HEIGHT WATER_REFLECTION !BLOOM !GRAIN WAVING_LEAVES WAVING_PLANTS STARS
profile.HOCH=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=3 SHADOW_SOFTNESS=1.0 COLORED_SHADOWS ENTITY_SHADOWS SPECULAR RAIN_WETNESS FOG_HEIGHT WATER_REFLECTION BLOOM !GRAIN WAVING_LEAVES WAVING_PLANTS STARS
profile.ULTRA=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=4 SHADOW_SOFTNESS=1.5 COLORED_SHADOWS ENTITY_SHADOWS SPECULAR RAIN_WETNESS FOG_HEIGHT WATER_REFLECTION BLOOM GRAIN WAVING_LEAVES WAVING_PLANTS STARS

# ---------- Menue-Aufbau ----------
screen=<profile> <empty> [SCHATTEN] [LICHT] [HIMMEL] [WASSER] [ANIMATION] [BILD]
screen.columns=2

screen.SCHATTEN=SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION COLORED_SHADOWS ENTITY_SHADOWS sunPathRotation
screen.LICHT=SUN_INTENSITY AMBIENT_INTENSITY NIGHT_BRIGHTNESS TORCH_INTENSITY TORCH_TEMPERATURE SPECULAR RAIN_WETNESS
screen.HIMMEL=STARS STAR_BRIGHTNESS SUN_GLOW FOG FOG_DENSITY FOG_HEIGHT FOG_HEIGHT_LEVEL CLOUD_BRIGHTNESS
screen.WASSER=WATER_WAVES WATER_WAVE_HEIGHT WATER_REFLECTION WATER_ALPHA WATER_COLOR_MODE
screen.ANIMATION=WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH WAVING_SPEED
screen.BILD=TONEMAP EXPOSURE SATURATION CONTRAST VIGNETTE BLOOM BLOOM_STRENGTH GRAIN GRAIN_STRENGTH GAMMA

sliders=shadowDistance SHADOW_SOFTNESS SHADOW_DISTORTION sunPathRotation SUN_INTENSITY AMBIENT_INTENSITY NIGHT_BRIGHTNESS TORCH_INTENSITY STAR_BRIGHTNESS SUN_GLOW FOG_DENSITY FOG_HEIGHT_LEVEL CLOUD_BRIGHTNESS WATER_WAVE_HEIGHT WATER_ALPHA WAVING_STRENGTH WAVING_SPEED EXPOSURE SATURATION CONTRAST VIGNETTE BLOOM_STRENGTH GRAIN_STRENGTH GAMMA
